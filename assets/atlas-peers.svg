<title id="t">Peer methods reach the baseline; PRISM's points are the only ones that end better than it</title>
<desc id="d">Scatter of compute to reach from-scratch quality versus final quality relative to the baseline. Reported peer figures (stackBERT 75%, bert2BERT 55%, LiGO 50%) all sit on the parity line. PRISM measured points: 600 steps at 42% and +1.5%, 800 steps at 56% and +3.7%, 1,500 steps at 97% and +7.9%; the fingerprint reused across corpora at 102% and +6.3%.</desc>
